name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build Linux
        run: cargo build --release

      - name: Build Windows (GNU)
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp target/release/seekfetch "dist/seekfetch-${RELEASE_TAG}-linux-x86_64"
          cp target/x86_64-pc-windows-gnu/release/seekfetch.exe \
            "dist/seekfetch-${RELEASE_TAG}-windows-x86_64.exe"
          ls -lh dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
